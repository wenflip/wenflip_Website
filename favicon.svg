<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="screenglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d96b"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- brand-gradient rounded tile so it reads as a wenflip mark, not a generic green square -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#pp)"/>
  <!-- green LCD -->
  <rect x="16" y="16" width="68" height="68" rx="14" fill="url(#screenglow)"/>
  <!-- bold diagonal up-right arrow, centered -->
  <g fill="none" stroke="#0b1f12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <line x1="34" y1="66" x2="64" y2="36"/>
  </g>
  <polygon points="72,28 48,32 68,52" fill="#0b1f12"/>
</svg>
